[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bankai-ai-config-sync"
version = "0.1.0"
description = "Local AI rules deployment and selected configuration backups"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
config-sync = ["tomlkit==0.13.3"]
dev = ["pytest>=8.4", "ruff>=0.14", "tomlkit==0.13.3"]

[project.scripts]
ai-config-sync = "ai_config_sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_config_sync*"]

[tool.ruff]
target-version = "py314"
line-length = 100
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
