[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bankai-x-follow"
version = "0.1.0"
description = "Read-only X relationship collection and analysis"
requires-python = ">=3.14"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.14"]

[project.scripts]
bankai = "bankai_tools.__main__:main"
x-follow = "bankai_tools.xfollow:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bankai_tools*"]

[tool.ruff]
target-version = "py314"
line-length = 100
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
