[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bankai-tools"
version = "0.1.0"
description = "Small personal tools and self-contained skills"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.14", "tomlkit==0.13.3"]
config-sync = ["tomlkit==0.13.3"]

[project.scripts]
bankai = "bankai_tools.__main__:main"

[tool.setuptools.packages.find]
where = ["tools/x-follow", "ai-config-sync"]
include = ["bankai_tools*", "ai_config_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
